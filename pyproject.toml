[project]
name = "northstar-infrastructure"
version = "0.1.0"
description = "Northstar Platform Infrastructure Layer - Technical adapters and external integrations"
readme = "README.md"
authors = [
    { name = "Dhruba1010", email = "dhrubasinha096p@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "exchange-calendars>=4.13.2",
    "northstar-application",
    "northstar-core",
]

[tool.uv.sources]
northstar-application = { path = "../northstar-application", editable = true }
northstar-core = { path = "../northstar-core", editable = true }

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

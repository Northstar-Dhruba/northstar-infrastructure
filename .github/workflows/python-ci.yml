name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: northstar-infrastructure

      - name: Checkout northstar-core
        uses: actions/checkout@v4
        with:
          repository: Northstar-Dhruba/northstar-core
          path: northstar-core

      - name: Checkout northstar-application
        uses: actions/checkout@v4
        with:
          repository: Northstar-Dhruba/northstar-application
          path: northstar-application

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync
        working-directory: northstar-infrastructure

      - name: Run Ruff
        run: uv run ruff check .
        working-directory: northstar-infrastructure

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .
        working-directory: northstar-infrastructure

      - name: Run Tests
        run: uv run pytest
        working-directory: northstar-infrastructure
